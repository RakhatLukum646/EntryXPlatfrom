<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entryx AI</title>
<!-- Интерфейс как в прототипе (claude.ai/artifact/AXfWhH1PyaJiRwKgyt8wCk): стили прототипа без изменений в /app.css.
     Данные живые: мост (/api/me, /api/inbox) и агенты Dify (/api/chat). -->
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top" id="top"></header>
<main class="stage noconsole app">
  <section class="phones" aria-label="Телефон роли">
    <div class="ph-col"><div class="phone"><div class="screen" id="screen"></div></div></div>
  </section>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<script>
/* ---------- иконки и мелочи (как в прототипе) ---------- */
const P = {
  back: '<path d="M15 6l-6 6 6 6"/>', chev: '<path d="M9 6l6 6-6 6"/>', plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
  send: '<path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>',
  spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  check: '<path d="M5 12l5 5L19 7"/>',
  bell: '<path d="M18 16v-5a6 6 0 1 0-12 0v5l-2 2h16z"/><path d="M10 21a2 2 0 0 0 4 0"/>',
  today: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>',
  pin: '<path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3H7l3-3z"/>',
  chat: '<path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.2A8 8 0 1 1 20 12z"/>',
  sig: '<path d="M3 18h2.5v-3H3zM8 18h2.5v-6H8zM13 18h2.5V9H13zM18 18h2.5V6H18z" fill="currentColor" stroke="none"/>',
  wifi: '<path d="M2.5 9a14 14 0 0 1 19 0"/><path d="M5.8 12.4a9.5 9.5 0 0 1 12.4 0"/><path d="M9.2 15.8a4.8 4.8 0 0 1 5.6 0"/>',
  bat: '<rect x="2" y="7.5" width="18" height="9" rx="2.6"/><rect x="4" y="9.5" width="12" height="5" rx="1.2" fill="currentColor" stroke="none"/><path d="M22 10.6v2.8"/>',
  panel: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>',
};
const ic = (k, s = 20, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const $ = id => document.getElementById(id);
const p2 = n => String(n).padStart(2, "0");
const hm = t => { const d = new Date(t); return p2(d.getHours()) + ":" + p2(d.getMinutes()); };
const MON = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const WD = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
const WDS = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const lower1 = s => s ? s[0].toLowerCase() + s.slice(1) : s;
const dm = t => { const d = new Date(t); return d.getDate() + " " + MON[d.getMonth()]; };
const longDay = t => cap(WD[new Date(t).getDay()]) + ", " + dm(t);
const ddiff = (a, b) => Math.round((new Date(new Date(a).toDateString()) - new Date(new Date(b).toDateString())) / 864e5);
const relDay = (t, now) => { const k = ddiff(t, now); return k === 0 ? "Сегодня" : k === -1 ? "Вчера" : WDS[new Date(t).getDay()] + ", " + dm(t); };
const listTime = (t, now) => { const k = ddiff(t, now); return k === 0 ? hm(t) : k === -1 ? "Вчера" : k > -7 ? WDS[new Date(t).getDay()] : dm(t); };
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };
const badge = (n, cls = "") => n ? `<span class="badge ${cls}">${n}</span>` : "";
const NC = ["#2457D6", "#15803D", "#C2410C", "#7C3AED", "#0E7490", "#B45309", "#16181D"];
const QUICK = ["Что горит?", "Что на этой неделе?", "Статус сделок", "Что от меня нужно?"];
const MENU_MSGS = new Set(["Сегодня", "Мои проекты"]);
const KIND = {overdue: "Просрочено", escalation: "Эскалация", held: "Сделка стоит", today: "Срок сегодня", problem: "Проблема", soon: "Напоминание", new: "Новая задача", info: "Изменение"};
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) { /* без хранилища — просто не помним */ } },
};
function toast(html) {
  const el = $("toast"); el.innerHTML = html; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 4200);
}

/* ---------- состояние ---------- */
const S = {
  agents: [], agent: "", me: null, inbox: null,
  scr: "today", pid: null, focus: null, pop: false,
  chats: {},          // ключ: "a" (ассистент) или id сделки → {conv, list, loaded}
  seen: {},           // все задачи, что видели (чтобы показать закрытую карточку в чате)
  done: {},           // id задачи → {label, at}: ответили отсюда
  picked: {},         // id задачи → выбранный вариант (ждём, когда мост закроет задачу)
  draft: {}, busy: false, scroll: {},
};
const meAgent = () => S.agents.find(a => a.key === S.agent) || {people: [], roles: [], title: ""};
const tasksOf = pid => (S.me ? S.me.tasks : []).filter(t => t.deal_id === pid);
const projectOf = pid => (S.me ? S.me.projects : []).find(p => p.id === pid);

/* ---------- ответ агента: markdown Dify + <button data-message> ---------- */
const BTN_RE = /<button\b[^>]*>[\s\S]*?<\/button>/g;
const parser = new DOMParser();
function buttonsIn(line) {
  return (line.match(BTN_RE) || []).map(h => {
    const el = parser.parseFromString(h, "text/html").body.firstElementChild;
    return el ? {label: el.textContent.trim(), msg: el.getAttribute("data-message") || el.textContent.trim(), pri: el.getAttribute("data-variant") === "primary"} : null;
  }).filter(Boolean);
}
function inline(s) {
  return esc(s)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<i>$2</i>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function parse(md) {
  md = String(md || "").replace(/\r/g, "").replace(/\[🔔[^\]]*\]\([^)]*\)/g, "");
  const blocks = []; let cur = null;
  for (const raw of md.split("\n")) {
    if (!raw.trim()) { cur = null; continue; }
    const btns = buttonsIn(raw), text = raw.replace(BTN_RE, "").trim();
    const num = raw.match(/^\s{0,2}(\d+)\.\s+(.*)$/);
    if (num) { cur = {t: "item", n: +num[1], head: num[2].replace(BTN_RE, "").trim(), lines: [], btns}; blocks.push(cur); continue; }
    if (cur && cur.t === "item" && /^\s{2,}/.test(raw)) { if (text) cur.lines.push(text); cur.btns.push(...btns); continue; }
    if (btns.length && !text) { blocks.push({t: "btns", btns}); cur = null; continue; }
    const qt = raw.match(/^\s*>\s?(.*)$/);
    if (qt) { // цитата в ответе агента — это текст письма/сообщения: показываем как письмо в прототипе
      if (!cur || cur.t !== "quote") { cur = {t: "quote", lines: []}; blocks.push(cur); }
      cur.lines.push(qt[1]); continue;
    }
    if (/^-{3,}$/.test(text)) { blocks.push({t: "hr"}); cur = null; continue; }
    const h = text.match(/^#{1,4}\s+(.*)$/);
    if (h) { blocks.push({t: "h", text: h[1]}); cur = null; continue; }
    const li = raw.match(/^\s*[-*•]\s+(.*)$/);
    if (li) {
      if (!cur || cur.t !== "ul") { cur = {t: "ul", items: []}; blocks.push(cur); }
      cur.items.push(li[1].replace(BTN_RE, "").trim());
      if (btns.length) { blocks.push({t: "btns", btns}); cur = null; }
      continue;
    }
    if (cur && cur.t === "p") cur.lines.push(text); else { cur = {t: "p", lines: [text]}; blocks.push(cur); }
    if (btns.length) { blocks.push({t: "btns", btns}); cur = null; }
  }
  return blocks;
}
const qbtn = (b, cls) => `<button class="${cls}${b.pri ? " pri" : ""}" data-q="${esc(b.msg)}" data-l="${esc(b.label)}">${esc(b.label)}</button>`;
function itemHTML(it) {
  const m = it.head.match(/^(⚠️\s*)?\*\*(.+?)\*\*\s*(?:·\s*(.*))?$/);
  if (!it.btns.length || !m) {
    let body = "", sub = [];
    const flush = () => { if (sub.length) body += `<ul>${sub.map(x => `<li>${inline(x)}</li>`).join("")}</ul>`; sub = []; };
    for (const l of it.lines) { const b = l.match(/^[-*•]\s+(.*)$/); if (b) sub.push(b[1]); else { flush(); body += "<br>" + inline(l); } }
    flush();
    return `<ol start="${it.n || 1}"><li>${inline(it.head)}${body}</li></ol>${it.btns.length ? `<div class="btns">${it.btns.map(b => qbtn(b, "btn sm")).join("")}</div>` : ""}`;
  }
  const prob = !!m[1], parts = (m[3] || "").split(" · ").filter(Boolean);
  let step = "", due = "", holds = null; const rest = [];
  for (const p of parts) {
    if (/^карточка/.test(p)) step = p.replace("карточка", "Шаг");
    else if (/^(срок|просрочено)/.test(p)) due = p;
    else if (/переход/.test(p)) holds = !/не держит/.test(p);
    else rest.push(p);
  }
  const pill = prob ? '<span class="pill act prob">Проблема</span>' : holds === false ? '<span class="pill done">Параллельно</span>' : '<span class="pill act">Нужно действие</span>';
  const meta = [step, ...rest.slice(1), due].filter(Boolean).map(esc).join(" · ");
  return `<div class="ab-task"><div class="tk-top">${pill}<span class="tk-meta">${meta}</span></div>
    <span class="tk-meta"><b style="color:var(--ink)">${esc(m[2])}</b>${rest[0] ? " · " + esc(rest[0]) : ""}</span>
    ${it.lines.map(l => `<p class="tk-ask">${inline(l)}</p>`).join("")}
    <div class="btns">${it.btns.map(b => qbtn(b, "btn sm")).join("")}</div></div>`;
}
function mdHTML(md, btnCls = "btn sm") {
  let out = "";
  for (const b of parse(md)) {
    if (b.t === "p") out += `<p>${b.lines.map(inline).join("<br>")}</p>`;
    else if (b.t === "item") out += itemHTML(b);
    else if (b.t === "ul") out += `<ul>${b.items.map(x => `<li>${inline(x)}</li>`).join("")}</ul>`;
    else if (b.t === "h") out += `<h3>${inline(b.text)}</h3>`;
    else if (b.t === "hr") out += "<hr>";
    else if (b.t === "quote") out += `<div class="letter"><div class="lt-b">${b.lines.map(inline).join("\n")}</div><div class="lt-gen">${ic("spark", 12, 2.2)}Текст подготовил Entryx AI — скопируйте и отправьте</div></div>`;
    else if (b.t === "btns") {
      const own = b.btns.filter(x => !MENU_MSGS.has(x.msg)); // «Сегодня» и «Мои проекты» — это вкладки приложения
      if (own.length) out += `<div class="btns">${own.map(x => qbtn(x, btnCls)).join("")}</div>`;
    }
  }
  return out;
}
function shown(q) {
  q = String(q || "");
  const m = q.match(/^Вариант:\s*(.+?)\s·\s/);
  if (m) return m[1];
  const d = q.match(/^По сделке «[^»]*»:\s*([\s\S]*)$/);
  if (d) return d[1];
  if (q === "Сегодня") return "Что на мне сегодня";
  return q.replace(/\s*\[[0-9a-f]{8}\]\s*$/, "").replace(/\s*#\d+\s*$/, "").replace(/\s{2,}/g, " ");
}

/* ---------- шапка страницы и выбор роли ---------- */
const avatar = (a, i, cls = "cav") => `<span class="${cls}" style="background:${NC[i % NC.length]}" aria-hidden="true">${esc((a.people[0] || a.title || "?")[0])}</span>`;
function renderTop() {
  const a = meAgent(), i = S.agents.indexOf(a), n = S.me ? S.me.tasks.length : 0;
  const pop = S.pop ? `<div class="pop" role="menu"><p class="cap3">Кто вы в этой вкладке</p>${S.agents.map((x, k) => `<button class="pop-i" role="menuitemradio" aria-checked="${x.key === S.agent}" data-agent="${x.key}">${avatar(x, k)}<span class="t"><b>${esc(x.people.join(", "))}</b><small>${esc(x.roles.join(", ").toLowerCase())}</small></span></button>`).join("")}</div>` : "";
  $("top").innerHTML = `<div class="brand"><span class="logo">${ic("spark", 18, 2.2)}</span><div><b>Entryx AI</b><span class="sub">Процесс ENTRYX v4 · сделки из CRM, агенты ролей в Dify</span></div></div>
  <div class="top-r"><a class="tbtn" href="/">${ic("panel", 16)}Трекер проектов</a><div class="rel"><button class="rolebtn" data-pop="1" aria-haspopup="true" aria-expanded="${S.pop}">${avatar(a, Math.max(i, 0))}<span><b>${esc(a.people.join(", "))}</b><small>${esc(a.roles.join(", "))}</small></span>${n ? `<span class="badge">${n}</span>` : ""}</button>${pop}</div></div>`;
  const hot = S.inbox ? S.inbox.hot : 0;
  document.title = (n ? `(${n}) ` : "") + (a.people.join(", ") || "Entryx") + " · Entryx AI";
}

/* ---------- экраны телефона ---------- */
const sbarHTML = () => `<div class="sbar"><span>${hm(Date.now())}</span><span class="island"></span><span class="sb-i">${ic("sig", 17)}${ic("wifi", 17, 2.2)}${ic("bat", 24, 1.6)}</span></div>`;
const pjIcon = (p, sm) => p ? `<span class="sq${sm ? " sm" : ""}" style="background:${p.color};color:#fff">${esc(p.letter)}</span>` : `<span class="sq light${sm ? " sm" : ""}">?</span>`;
function tabbarHTML() {
  const nt = S.me ? S.me.tasks.length : 0, nb = S.inbox ? S.inbox.hot : 0;
  return `<nav class="tabbar" aria-label="Разделы"><button class="tab${S.scr === "today" ? " on" : ""}" data-go="today">${ic("today", 24, 1.8)}<span>Сегодня</span>${nt ? `<span class="badge" aria-label="Ждут действия: ${nt}">${nt}</span>` : ""}</button><button class="tab${S.scr === "notif" ? " on" : ""}" data-go="notif">${ic("bell", 24, 1.8)}<span>Уведомления</span>${nb ? `<span class="badge">${nb}</span>` : ""}</button></nav>`;
}
function todayHTML() {
  const now = Date.now(), me = S.me;
  if (!me) return `<div class="body"><div class="td-head"><div class="td-date">${esc(longDay(now))}</div><div class="td-row"><h1>Сегодня</h1></div></div><div class="td-list"><div class="td-empty"><b>Загружаю дела…</b></div></div></div>${tabbarHTML()}`;
  const tasks = me.tasks, n = tasks.length, hotN = tasks.filter(t => t.hot).length;
  const row = t => `<button class="td-item" data-task="${t.id}"><span class="dot${t.hot ? " red" : ""}"></span><span class="td-t"><span class="td-o"><span class="td-pj"><i style="background:${t.color}"></i>${esc(t.deal)}</span><span class="td-u${t.hot ? " hot" : ""}">${esc(t.due)}</span></span><span class="td-a">${t.branch ? "⚠️ " : ""}${esc(t.title)}</span></span>${ic("chev", 20)}</button>`;
  let empty = `<div class="td-empty"><b>${me.projects.length ? "На сегодня всё" : "Сделок в работе нет"}</b>`;
  if (me.projects.length) empty += "<span>Новые задачи появятся здесь, когда сделка дойдёт до вашего шага.</span>";
  for (const p of me.projects) if (p.turn) empty += `<span><b style="font-weight:600">${esc(p.name)}.</b> ${esc(p.turn)}</span>`;
  empty += "</div>";
  const prow = p => `<button class="pr-row" data-pid="${p.id}">${pjIcon(p)}<span class="pr-t"><b>${esc(p.name)}</b><span>${esc(p.stage)}</span></span>${badge(tasksOf(p.id).length)}</button>`;
  return `<div class="body"><div class="td-head"><div class="td-date">${esc(longDay(now))}</div><div class="td-row"><h1>Сегодня</h1><span class="td-n">${n ? n + " " + plural(n, "дело", "дела", "дел") + (hotN ? ` · ${hotN} срочно` : "") : "дел нет"}</span></div></div>
  <div class="td-list">${tasks.map(row).join("") || empty}</div><div class="cap">Мои проекты</div>${me.projects.map(prow).join("") || '<p class="mut" style="padding:4px 24px">Пока нет сделок с вашими шагами.</p>'}<div style="height:12px"></div></div>
  <div class="td-ask"><div class="chips">${QUICK.map(q => `<button class="chip" data-ask="${esc(q)}">${esc(q)}</button>`).join("")}</div>
  <form class="askbar" data-form="today"><label class="sr" for="q-today">Вопрос ассистенту</label><input id="q-today" data-k="today" autocomplete="off" placeholder="Спросите про любой проект" value="${esc(S.draft.today || "")}"><button class="rbtn" aria-label="Спросить">${ic("send", 18)}</button></form></div>
  ${tabbarHTML()}`;
}
function notifHTML() {
  const now = Date.now(), d = S.inbox, me = S.me;
  const a = (S.chats.a && S.chats.a.list) || [], la = [...a].reverse().find(m => m.from === "bot" && m.text);
  const prev = la ? parse(la.text).filter(b => b.t === "p").map(b => b.lines.join(" ")).join(" ").replace(/\*\*/g, "") : "";
  let h = `<div class="body"><h1 class="big-t">Уведомления</h1>
  <button class="as-row" data-go="achat"><span class="as-ic">${ic("spark", 22, 2)}</span><span class="pr-t"><b>Ассистент</b><span>${esc(prev || "Спросите про любой проект")}</span></span></button>`;
  const items = d ? d.items : [];
  if (items.length) {
    h += `<div class="cap">Важное</div><div class="td-list">` + items.map(i => `<button class="td-item" data-pid="${i.deal_id}"><span class="dot${i.hot ? " red" : ""}"></span><span class="td-t"><span class="td-o"><span class="td-pj">${esc(i.deal)}</span><span class="td-u${i.hot ? " hot" : ""}">${esc(KIND[i.kind] || "")}${i.at ? " · " + esc(listTime(i.at, now)) : ""}</span></span><span class="td-a">${esc(i.title || i.text)}</span>${i.title ? `<span class="td-o">${esc(i.text)}</span>` : ""}</span>${ic("chev", 20)}</button>`).join("") + "</div>";
  }
  const projects = me ? me.projects : [];
  if (projects.length) {
    h += `<div class="cap">Проекты</div>` + projects.map(p => {
      const ev = [...p.events].reverse().find(e => e.kind !== "done");
      return `<button class="gr-row" data-pid="${p.id}">${pjIcon(p)}<span class="gr-t"><span class="gr-1"><b>${esc(p.name)}</b><span>${ev ? esc(listTime(ev.at, now)) : ""}</span></span><span class="gr-2">Фаза ${p.phase + 1} из ${me.phases.length} · ${esc(lower1(p.stage))}</span><span class="gr-3"><span>${esc(ev ? ev.text : p.turn)}</span>${badge(tasksOf(p.id).length)}</span></span></button>`;
    }).join("");
  }
  if (!items.length && !projects.length) h += '<div class="td-list"><div class="td-empty"><b>Всё спокойно</b><span>Просрочек, эскалаций и проблем нет.</span></div></div>';
  return h + `<div style="height:12px"></div></div>${tabbarHTML()}`;
}
function miniBar(i) {
  const ph = S.me ? S.me.phases : [];
  return `<div class="mbar">${ph.map((s, k) => `<i class="${k <= i ? "on" : ""}"></i>`).join("")}</div><div class="mbar-l">Фаза ${i + 1} из ${ph.length} · <b>${esc(ph[i] || "")}</b></div>`;
}
function taskHTML(t) {
  const d = S.done[t.id], now = Date.now();
  const pill = d ? `<span class="pill done">${ic("check", 12, 3)}${esc(d.label)} · ${esc(relDay(d.at, now).toLowerCase())}, ${hm(d.at)}</span>`
    : t.branch ? '<span class="pill act prob">Проблема · нужно решение</span>'
    : t.by_bot ? `<span class="pill act">${ic("spark", 11, 2.4)}Подготовил бот · подтвердите</span>` : '<span class="pill act">Нужно действие</span>';
  const meta = `Шаг ${esc(t.card)} · ${esc(t.stage)}${d ? "" : t.due_date ? " · до " + esc(t.due_date) : ""}`;
  let h = `<div class="tk-top">${pill}<span class="tk-meta">${meta}</span></div><p class="tk-ask">${esc(t.title)}</p>`;
  if (t.body && !d) {
    const open = S.draft["open:" + t.id];
    h += `<div class="tk-body${open ? "" : " clip"}">${mdHTML(t.body)}</div>${t.body.length > 260 ? `<button class="more" data-more="${t.id}">${open ? "Свернуть" : "Показать полностью"}</button>` : ""}`;
  }
  if (!d) {
    const wait = S.picked[t.id];
    h += `<div class="btns">${t.options.map(o => `<button class="btn${o.pri ? " pri" : ""}" data-opt="${t.id}" data-q="${esc(o.cmd)}" data-l="${esc(o.label)}"${wait ? " disabled" : ""}>${esc(o.label)}</button>`).join("")}<button class="btn" data-q="${esc(t.draft)}" data-l="Черновик"${wait ? " disabled" : ""}>Черновик</button></div>`;
    if (wait) h += `<span class="hint">Ответ «${esc(wait)}» принят${S.chats[t.deal_id] && /причин/i.test(lastBot(t.deal_id)) ? " — напишите причину в строке ниже" : ", бот передаёт карточку дальше…"}</span>`;
  }
  return `<div class="m task${d ? " is-done" : ""}${t.branch && !d ? " is-prob" : ""}" id="t-${t.id}">${h}</div>`;
}
const lastBot = key => { const l = (S.chats[key] && S.chats[key].list) || []; const m = [...l].reverse().find(x => x.from === "bot"); return m ? m.text || "" : ""; };
function messagesHTML(key) {
  const c = S.chats[key]; if (!c) return "";
  const now = Date.now(); let out = "", prev = null;
  c.list.forEach((m, i) => {
    if (m.at && (prev === null || ddiff(m.at, prev) !== 0)) out += `<div class="sep">${esc(relDay(m.at, now))}, ${hm(m.at)}</div>`;
    else if (m.at && prev && m.at - prev >= 50 * 60000) out += `<div class="sep">${hm(m.at)}</div>`;
    if (m.at) prev = m.at;
    const a = m.fresh ? " in" : "";
    if (m.from === "me") { out += `<div class="m me${a}"><div class="bub">${esc(m.text)}</div></div>`; return; }
    let inner = m.text ? `<div class="md">${mdHTML(m.text)}</div>` : m.pending ? '<div class="typing" aria-label="Агент печатает"><i></i><i></i><i></i></div>' : "";
    if (m.err) inner += `<div class="err">Агент не ответил: ${esc(m.err)}</div><div class="btns"><button class="btn sm" data-retry="${esc(key)}">Повторить</button></div>`;
    out += `<div class="m${a}">${inner}</div>`;
  });
  return out;
}
function composerHTML(key, placeholder) {
  return `<div class="comp"><form class="comp-row" data-form="${esc(key)}"><button type="button" class="ib round" data-attach="1" aria-label="Прикрепить документ">${ic("plus", 20)}</button><div class="cin"><label class="sr" for="in-${esc(key)}">Сообщение</label><input id="in-${esc(key)}" data-k="${esc(key)}" autocomplete="off" placeholder="${esc(placeholder)}" value="${esc(S.draft[key] || "")}"><button class="send" aria-label="Отправить"${S.busy ? " disabled" : ""}>${ic("send", 16, 2.2)}</button></div></form></div>`;
}
function pchatHTML() {
  const p = projectOf(S.pid), now = Date.now();
  const name = p ? p.name : "Сделка";
  const head = `<div class="hdr"><button class="ib" data-back="1" aria-label="Назад">${ic("back", 22)}</button><div class="hdr-t"><b>${esc(name)}</b><span>${esc(p ? p.stage : "")}</span></div><button class="ib" data-go="achat" aria-label="Ассистент">${ic("chat", 22, 1.8)}</button></div>`;
  const turn = p && p.turn ? `<div class="turn">${ic("pin", 15)}<span>${p.turn.startsWith("Сейчас шаг:") ? `<b>Сейчас шаг:</b> ${esc(p.turn.slice(12))}` : `<b>${esc(p.turn)}</b>`}</span></div>` : "";
  let chat = "";
  if (p) {
    chat += `<div class="m"><p>Чат по <b>${esc(p.full || p.name)}</b>: ваши задачи по сделке, ход процесса и вопросы агенту.</p>${miniBar(p.phase)}</div>`;
    const ev = p.events.filter(e => ["stage", "answer", "problem", "held", "task"].includes(e.kind)).slice(-12);
    let prev = null;
    for (const e of ev) {
      if (prev === null || ddiff(e.at, prev) !== 0) chat += `<div class="sep">${esc(relDay(e.at, now))}, ${hm(e.at)}</div>`;
      prev = e.at;
      const txt = e.kind === "stage" ? `<b>${esc(e.text)}</b>` : esc(e.text);
      chat += `<div class="m"><p class="jr${e.kind === "problem" ? " prob" : ""}">${e.kind === "problem" ? "⚠️ " : ""}${txt}</p></div>`;
    }
  }
  const open = tasksOf(S.pid), ids = new Set(open.map(t => t.id));
  const closed = Object.values(S.seen).filter(t => t.deal_id === S.pid && !ids.has(t.id) && S.done[t.id]);
  chat += closed.concat(open).map(taskHTML).join("");
  chat += messagesHTML(S.pid);
  const ph = /причин/i.test(lastBot(S.pid)) && /Отмена/.test(lastBot(S.pid)) ? "Напишите причину — запишу в сделку" : "Спросить по " + name;
  return `${head}${turn}<div class="body"><div class="chat">${chat}</div></div>${composerHTML(S.pid, ph)}`;
}
function achatHTML() {
  const head = `<div class="hdr"><button class="ib" data-back="1" aria-label="Назад">${ic("back", 22)}</button><div class="hdr-t"><b>Ассистент</b><span>Все ваши проекты, задачи и люди</span></div><button class="ib" data-fresh="1" aria-label="Новый разговор" title="Новый разговор">${ic("plus", 22, 1.8)}</button></div>`;
  const ph = /причин/i.test(lastBot("a")) && /Отмена/.test(lastBot("a")) ? "Напишите причину — запишу в сделку" : "Спросите про любой проект";
  return `${head}<div class="body"><div class="chat">${messagesHTML("a")}</div></div>${composerHTML("a", ph)}`;
}
function renderPhone() {
  const host = $("screen"), old = host.querySelector(".body"), key = S.scr + ":" + (S.pid || "");
  if (old && S.key) S.scroll[S.key] = {top: old.scrollTop, bottom: old.scrollHeight - old.scrollTop - old.clientHeight < 80};
  const ae = document.activeElement; let foc = null;
  if (ae && host.contains(ae) && ae.dataset && ae.dataset.k) foc = {k: ae.dataset.k, s: ae.selectionStart, e: ae.selectionEnd};
  const inner = S.scr === "notif" ? notifHTML() : S.scr === "pchat" ? pchatHTML() : S.scr === "achat" ? achatHTML() : todayHTML();
  host.innerHTML = sbarHTML() + inner + '<div class="home-ind"></div>';
  const nb = host.querySelector(".body"), sc = S.scroll[key], isChat = S.scr === "pchat" || S.scr === "achat";
  if (nb) {
    if (S.focus) {
      const el = $("t-" + S.focus);
      if (el) { nb.scrollTop = Math.max(0, el.offsetTop - 70); el.classList.add("hl"); setTimeout(() => el.classList.remove("hl"), 1800); }
      else nb.scrollTop = nb.scrollHeight;
      S.focus = null;
    } else if (isChat) nb.scrollTop = !sc || sc.bottom || key !== S.key ? nb.scrollHeight : sc.top;
    else nb.scrollTop = sc && key === S.key ? sc.top : 0;
  }
  S.key = key;
  if (foc) { const el = host.querySelector(`[data-k="${foc.k}"]`); if (el) { try { el.focus({preventScroll: true}); el.setSelectionRange(foc.s, foc.e); } catch (e) { /* поле без выделения */ } } }
  for (const m of Object.values(S.chats)) for (const x of m.list) x.fresh = false;
}
function render() { renderTop(); renderPhone(); }

/* ---------- данные ---------- */
let sigMe = "", sigInbox = "";
async function loadMe() {
  try {
    const r = await fetch("/api/me?agent=" + encodeURIComponent(S.agent));
    if (!r.ok) return;
    const d = await r.json(), sig = JSON.stringify(d);
    for (const t of d.tasks) S.seen[t.id] = t;
    const open = new Set(d.tasks.map(t => t.id));
    for (const [id, label] of Object.entries(S.picked)) if (!open.has(id)) { S.done[id] = {label, at: Date.now()}; delete S.picked[id]; }
    S.me = d;
    if (sig !== sigMe) { sigMe = sig; render(); }
  } catch (e) { /* мост недоступен — покажем, что есть */ }
}
async function loadInbox() {
  try {
    const r = await fetch("/api/inbox?agent=" + encodeURIComponent(S.agent));
    if (!r.ok) return;
    const d = await r.json(), sig = JSON.stringify([d.hot, d.items]);
    S.inbox = d;
    if (sig !== sigInbox) { sigInbox = sig; render(); }
  } catch (e) { /* мост недоступен */ }
}
const convKey = key => `entryx.conv.${S.agent}.${key}`;
const scopeOf = key => key === "a" ? "" : key.slice(0, 8);
async function loadChat(key, conv) {
  const c = S.chats[key] = S.chats[key] || {conv: "", list: [], loaded: false};
  try {
    const id = conv ?? store.get(convKey(key));
    const r = await fetch(`/api/history?agent=${encodeURIComponent(S.agent)}&scope=${scopeOf(key)}&conversation_id=${encodeURIComponent(id || "")}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.status);
    c.conv = d.conversation_id || "";
    if (c.conv) store.set(convKey(key), c.conv);
    const list = [];
    if (key === "a" && d.opening) list.push({from: "bot", text: d.opening});
    for (const m of d.messages) {
      const at = m.at ? m.at * 1000 : null;
      if (m.query) list.push({from: "me", text: shown(m.query), at});
      list.push({from: "bot", text: m.answer, at});
    }
    c.list = list;
  } catch (e) {
    c.list = [{from: "bot", text: "", err: "история не загрузилась (" + e.message + ")"}];
  }
  c.loaded = true;
  if (S.scr === "achat" && key === "a" || S.scr === "pchat" && key === S.pid) renderPhone();
}
let last = null;
async function send(key, query, label, opt) {
  query = String(query || "").trim();
  if (!query || S.busy) return;
  if (!S.chats[key] || !S.chats[key].loaded) await loadChat(key);
  const c = S.chats[key];
  last = [key, query, label, opt];
  S.busy = true;
  if (opt) S.picked[opt] = label;
  const now = Date.now();
  c.list.push({from: "me", text: label || shown(query), at: now, fresh: true});
  const bot = {from: "bot", text: "", pending: true, at: now, fresh: true};
  c.list.push(bot);
  S.scroll[S.scr + ":" + (S.pid || "")] = {bottom: true};
  renderPhone();
  let raf = 0;
  const paint = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; renderPhone(); }); };
  try {
    const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({agent: S.agent, query, conversation_id: c.conv, scope: scopeOf(key)})});
    if (!r.ok || !r.body) throw new Error("мост ответил " + r.status);
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let cut;
      while ((cut = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, cut); buf = buf.slice(cut + 2);
        const line = chunk.split("\n").find(l => l.startsWith("data:"));
        if (!line) continue;
        let ev; try { ev = JSON.parse(line.slice(5)); } catch (e) { continue; }
        if (ev.conversation_id && ev.conversation_id !== c.conv) { c.conv = ev.conversation_id; store.set(convKey(key), c.conv); }
        if (ev.event === "message" || ev.event === "agent_message") { bot.text += ev.answer || ""; paint(); }
        else if (ev.event === "message_replace") { bot.text = ev.answer || ""; paint(); }
        else if (ev.event === "error") bot.err = ev.message || "ошибка";
      }
    }
    if (!bot.text && !bot.err) bot.err = "пустой ответ";
  } catch (e) { bot.err = e.message; }
  if (bot.err && opt) delete S.picked[opt];
  bot.pending = false; S.busy = false;
  cancelAnimationFrame(raf); raf = 0;
  renderPhone();
  // Ответ кнопкой закрывает задачу в CRM: мост двигает сделку за пару секунд — обновляем дела и уведомления.
  setTimeout(() => { loadMe(); loadInbox(); }, 1200);
  setTimeout(() => { loadMe(); loadInbox(); }, 6000);
}
function go(scr, pid) {
  S.scr = scr; S.pid = pid || null; S.pop = false;
  const u = new URL(location.href); u.hash = scr === "today" ? "" : scr === "pchat" ? "deal=" + pid : scr; history.replaceState(null, "", u);
  if (scr === "pchat" && (!S.chats[pid] || !S.chats[pid].loaded)) loadChat(pid);
  if (scr === "achat" && (!S.chats.a || !S.chats.a.loaded)) loadChat("a");
  render();
}
async function pickAgent(key) {
  S.agent = key; S.me = null; S.inbox = null; S.chats = {}; S.seen = {}; S.done = {}; S.picked = {}; S.draft = {}; S.scroll = {};
  sigMe = sigInbox = "";
  store.set("entryx.agent", key);
  const u = new URL(location.href); u.searchParams.set("agent", key); history.replaceState(null, "", u);
  render();
  await Promise.all([loadMe(), loadInbox(), loadChat("a")]);
}

/* ---------- события ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button, a");
  if (!t) { if (S.pop) { S.pop = false; renderTop(); } return; }
  const ds = t.dataset;
  if (ds.pop) { S.pop = !S.pop; renderTop(); return; }
  if (ds.agent) { S.pop = false; pickAgent(ds.agent).then(() => go("today")); return; }
  if (S.pop) { S.pop = false; renderTop(); }
  if (ds.go) { go(ds.go); return; }
  if (ds.back) { go(S.scr === "pchat" && S.from === "notif" ? "notif" : "today"); return; }
  if (ds.task) { const tk = S.me && S.me.tasks.find(x => x.id === ds.task); if (tk) { S.from = S.scr; S.focus = tk.id; go("pchat", tk.deal_id); } return; }
  if (ds.pid) { S.from = S.scr; go("pchat", ds.pid); return; }
  if (ds.ask) { go("achat"); send("a", ds.ask); return; }
  if (ds.more) { S.draft["open:" + ds.more] = !S.draft["open:" + ds.more]; renderPhone(); return; }
  if (ds.fresh) { store.set(convKey("a"), ""); loadChat("a", "new"); return; }
  if (ds.attach) { toast("Документы пока прикладываются к сделке в CRM. Загрузка из чата — следующий шаг."); return; }
  if (ds.retry && last) { const c = S.chats[last[0]]; if (c) c.list.splice(-2, 2); send(...last); return; }
  if (ds.q) { const key = S.scr === "pchat" ? S.pid : "a"; if (S.scr !== "pchat" && S.scr !== "achat") go("achat"); send(key, ds.q, ds.l, ds.opt); }
});
document.addEventListener("input", e => { const k = e.target.dataset && e.target.dataset.k; if (k) S.draft[k] = e.target.value; });
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target.closest("form"); if (!f) return;
  const key = f.dataset.form, inp = f.querySelector("input"), v = inp.value.trim();
  if (!v || S.busy) return;
  inp.value = ""; S.draft[key === "today" ? "today" : key] = "";
  if (key === "today") { go("achat"); send("a", v); return; }
  if (key === "a") { send("a", v); return; }
  // Чат сделки: вопрос агенту — с названием сделки; ответ на «напишите причину» — как есть.
  const p = projectOf(key), raw = /причин/i.test(lastBot(key)) && /Отмена/.test(lastBot(key));
  send(key, raw || !p ? v : `По сделке «${p.full || p.name}»: ${v}`, v);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.pop) { S.pop = false; renderTop(); } });

(async function boot() {
  try { S.agents = await (await fetch("/api/agents")).json(); } catch (e) { S.agents = []; }
  const qs = new URLSearchParams(location.search);
  const want = qs.get("agent") || store.get("entryx.agent") || "manager";
  await pickAgent(S.agents.some(a => a.key === want) ? want : (S.agents[0] || {key: "manager"}).key);
  // Ссылки снаружи: #inbox из чата Dify → «Уведомления»; ?ask=… со страницы уведомлений; #deal=<id> → чат сделки.
  const ask = qs.get("ask"), h = location.hash;
  if (ask) { const u = new URL(location.href); u.searchParams.delete("ask"); history.replaceState(null, "", u); if (ask === "Мои проекты") go("notif"); else go("today"); }
  else if (h === "#inbox" || h === "#notif") go("notif");
  else if (h === "#achat") go("achat");
  else if (h.startsWith("#deal=")) go("pchat", h.slice(6));
  setInterval(() => { loadMe(); loadInbox(); }, 15000);
  setInterval(() => { const sb = document.querySelector(".sbar span"); if (sb) sb.textContent = hm(Date.now()); }, 30000);
})();
</script>
