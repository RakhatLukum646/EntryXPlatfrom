      <button data-variant="primary" data-message="Сегодня">Что на мне сегодня</button> <button data-message="Мои проекты">Мои проекты</button>


      [🔔 Уведомления](http://localhost:8787/app?agent=logistika#inbox)'
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - Что горит у меня (Руслан)?
    - Как проверить документ на шаге 4?
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
