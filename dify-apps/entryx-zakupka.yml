            \ получить подтверждение и срок изготовления, вписать срок в сделку.\n- [На изготовлении · карточка 2 · Юлия] Каждую среду — статус завода по заказу в сделку. За 10 дней до срока запросить официальное письмо: дата готовности и состав машин. Вписать подтверждённую дату готовности.\n    правило: Дата готовности — только по официальному письму завода\n    правило: 2 недели без движения — эскалация Опердиру\n- [Подготовка к отгрузке · карточка 4 · Юлия] Отправить заводу доверенность и данные водителя, прикрепить подтверждение завода.\n- [Погрузка · карточка 5 · Юлия] За день до погрузки — письмо заводу с порядком погрузки по точкам разгрузки.\n- [В пути · карточка 6 · Юлия] Сообщение о выезде в группу «ПОСТАВКИ» по шаблону: ЖК, откуда и когда, номер заказа и счёта, количество, порядок погрузки, машина и водитель.\n\nПодготовь черновик:\n- Канал: почта (завод, заказчик) или WhatsApp (водитель, начальник участка, грузчики), УчётЭДО (перевозчик).\n- Формат: Кому · Тема (для почты) ·\
