app:
  description: 'Агент менеджера сделки: флоу по этапам сделки для моста и чат для сотрудника. Сгенерировано из process/stages.yaml.'
  icon: 🚪
  icon_background: '#E6EBFB'
  icon_type: emoji
  mode: advanced-chat
  name: entryx-manager
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: 'Здравствуйте, Данил. Я агент менеджера сделки. Вижу ваши сделки и задачи в CRM. Нажмите «Что на мне сегодня»: у каждого дела кнопки ответа, и карточка уйдёт следующему. Или спросите что угодно: что горит, черновик письма, проверка документа; под ответом будут ваши дела с кнопками.


      <button data-variant="primary" data-message="Сегодня">Что на мне сегодня</button> <button data-message="Мои проекты">Мои проекты</button>


      [🔔 Уведомления](http://localhost:8787/app?agent=manager#inbox)'
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - Что горит у меня (Данил)?
    - 'Подготовь черновик: выставить счёт на аванс по договору, отправить снабженцу, вписать срок оплаты'
    - Как проверить документ на шаге 1?
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: http-request
      id: start-source-crm-target
      source: start
      sourceHandle: source
      target: crm
      targetHandle: target
      type: custom
      zIndex: 0
