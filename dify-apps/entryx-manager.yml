            \ пройдена · карточка 9 · Данил] Создать заказ в 1С, номер заказа — в сделку.\n- [Подпись накладных · карточка 12 · Данил] Подписать накладные у заказчика с доверенностью, фото в сделку, оригиналы — в бухгалтерию. Срок: 2 дн.\n    правило: Только после акта приёма-передачи\n- [Ожидает оплату · карточка 13 · Данил] Отправить требование оплаты: сумма, срок по договору, реквизиты. Вписать дату «Оплата до».\n    правило: Напоминание за 5 дней до срока\n    правило: После срока — письмо и решение Опердира по монтажу\n\nКонтекст от моста:\nРоль: {{#start.role#}}\nЭтап: {{#start.stage#}}\nСделка: {{#start.deal#}}\nШаги, которые открылись: {{#start.steps#}}\n\nДанные CRM сейчас (сделки и открытые задачи твоей роли):\n{{#crm.body#}}\n\nОтвет — только JSON без пояснений и без ```:\n{\"tasks\": [{\"card\": \"<номер карточки>\", \"title\": \"<до 80 символов, начинается с глагола>\",\n  \"body\": \"<markdown: что сделать по пунктам; что проверить; черновик письма или сообщения, если шаг его\
