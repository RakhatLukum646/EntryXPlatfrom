            \ с заказчиком · карточка 1б · Данил] (если: Нужен аванс от заказчика) Выставить счёт на аванс по договору, отправить снабженцу, вписать срок оплаты.\n    правило: Сверка аванс не ждёт: аванс держит только переход в «Подпись и запуск»\n- [В пути · карточка 6.1 · Данил] Счёт на оплату по накладной завода, запрос доверенности у снабженца в день выезда. Проверить доверенность: сумма, юрлицо, срок, подпись и печать.\n    правило: Напоминать каждый день, со 2-го дня — начальник участка\n    правило: За день до границы нет доверенности — эскалация Опердиру\n- [Подпись накладных · карточка 12 · Данил] Подписать накладные у заказчика с доверенностью, фото в сделку, оригиналы — в бухгалтерию. Срок: 2 дн.\n    правило: Только после акта приёма-передачи\n\nДай чек-лист проверки документа:\n☐ тип документа · ☐ подпись и печать · ☐ совпадение с заявкой и спецификацией (позиции, количество, размеры) · ☐ даты и сроки · ☐ сумма и реквизиты · ☐ особые правила этапа.\nДля каждого пункта: что именно\
            \ сверить с чем. Затем: что делать, если пункт не прошёл (кому написать, держит ли это переход)."
